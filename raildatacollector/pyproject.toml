[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raildatacollector"
version = "1.0.0"
description = "Thailand Railway data collector microservice"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.44.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "geoalchemy2>=0.18.0",
    "asyncpg>=0.31.0",
    "aiohttp>=3.13.0",
    "apscheduler>=3.11.0",
    "structlog>=25.5.0",
    "python-socketio[asyncio_client]>=5.16.0",
    "redis[asyncio]>=7.0.0",
    "shapely>=2.1.0",
    "beautifulsoup4>=4.14.0",
    "lxml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "TCH", "ERA", "PTH"]
ignore = ["E501", "S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-v"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
