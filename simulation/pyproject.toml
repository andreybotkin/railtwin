[project]
name = "thailand-railway-simulation"
version = "1.0.0"
description = "Thailand Railway Digital Twin - Simulation API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Thailand Railway Team" }]
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.44.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "sqlalchemy>=2.0.49",
    "geoalchemy2>=0.18.0",
    "asyncpg>=0.31.0",
    "shapely>=2.1.0",
    "geojson>=3.2.0",
    "structlog>=25.5.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "httpx>=0.28.0",
    "redis>=7.0.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.26",
    "pyproj>=3.7.0",
    "python-socketio[asyncio_client]>=5.16.0",
    "aiohttp>=3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "httpx>=0.28.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.venv
    | venv
    | alembic
    | __pycache__
)/
'''

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
strict = false
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-v"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*"]
