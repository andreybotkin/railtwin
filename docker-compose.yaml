name: thailand-railway-digital-twin

services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: railway-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railway_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-railway_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railway-network

  redis:
    image: redis:8-alpine
    container_name: railway-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railway-network

  simulation:
    build:
      context: ./simulation
      dockerfile: Dockerfile
    container_name: railway-simulation
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/railway_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${SIMULATION_CORS_ORIGINS:-http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000,http://127.0.0.1:8000}
      DEBUG: ${DEBUG:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      WS_HEARTBEAT_INTERVAL: ${WS_HEARTBEAT_INTERVAL:-10}
      POSITION_CACHE_INTERVAL_SECONDS: ${POSITION_CACHE_INTERVAL_SECONDS:-10}
      TRAJECTORY_REFRESH_INTERVAL_SECONDS: ${TRAJECTORY_REFRESH_INTERVAL_SECONDS:-20}
    ports:
      - "${SIMULATION_PORT:-8000}:8000"
    depends_on:
      raildbsetup:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./simulation:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - railway-network

  raildbsetup:
    build:
      context: ./raildbsetup
      dockerfile: Dockerfile
    container_name: railway-raildbsetup
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/railway_db}
      KML_LOCAL_PATH: /app/railroad/20260428RailwayMapofThailand.kml
      STATIONS_KML_PATH: /app/railroad/20260428Thai_railway_stations.kml
      SCHEDULE_RAW_DIR: /app/schedule/raw
      SCHEDULE_SEED_PATH: /app/schedule/schedules_seed.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
    ports:
      - "${SETUP_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./raildbsetup:/app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    networks:
      - railway-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: railway-gateway
    env_file:
      - .env
    environment:
      SIMULATION_URL: ${SIMULATION_URL:-http://simulation:8000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000,http://localhost:8002,http://127.0.0.1:3000,http://127.0.0.1:8002}
      WS_POLL_INTERVAL: ${WS_POLL_INTERVAL:-10}
      TRAJECTORY_POLL_INTERVAL: ${TRAJECTORY_POLL_INTERVAL:-10}
    ports:
      - "${GATEWAY_PORT:-8002}:8002"
    depends_on:
      simulation:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./gateway:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - railway-network

  raildatacollector:
    build:
      context: ./raildatacollector
      dockerfile: Dockerfile
    container_name: railway-raildatacollector
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/railway_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCHEDULE_DATA_DIR: /app/schedule
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
    ports:
      - "${COLLECTOR_PORT:-8001}:8001"
    depends_on:
      raildbsetup:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./raildatacollector:/app
    networks:
      - railway-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${GATEWAY_PORT:-8002}
        NEXT_PUBLIC_WS_URL: ws://localhost:${GATEWAY_PORT:-8002}
    container_name: railway-frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${GATEWAY_PORT:-8002}
      NEXT_PUBLIC_WS_URL: ws://localhost:${GATEWAY_PORT:-8002}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - railway-network

  # pgadmin:
  #   image: dpage/pgadmin4:8
  #   container_name: railway-pgadmin
  #   profiles: ["tools"]
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@example.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "${PGADMIN_PORT:-5050}:80"
  #   depends_on:
  #     - postgres
  #   networks:
  #     - railway-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: railway-redis-commander
    profiles: ["tools"]
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    networks:
      - railway-network

volumes:
  postgres_data:
  redis_data:

networks:
  railway-network:
    driver: bridge
