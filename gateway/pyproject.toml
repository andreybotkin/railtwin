[project]
name = "thailand-railway-gateway"
version = "1.0.0"
description = "Stateless Gateway for Thailand Railway Digital Twin"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Thailand Railway Team" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "redis>=5.0.1",
    "structlog>=24.1.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
