name: Validate Collector Python 3.12

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/46-raildatacollector-python-312

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Regenerate lock file
        working-directory: raildatacollector
        run: uv lock --python 3.12

      - name: Install dependencies
        working-directory: raildatacollector
        run: uv pip install --system -e ".[dev]"

      - name: Run Ruff
        working-directory: raildatacollector
        run: ruff check app tests

      - name: Run Black
        working-directory: raildatacollector
        run: black --check app tests

      - name: Run mypy
        working-directory: raildatacollector
        run: mypy app

      - name: Run tests
        working-directory: raildatacollector
        run: pytest --cov=app --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t raildatacollector:python312 raildatacollector

      - name: Upload regenerated lock
        uses: actions/upload-artifact@v4
        with:
          name: raildatacollector-uv-lock
          path: raildatacollector/uv.lock
          if-no-files-found: error
