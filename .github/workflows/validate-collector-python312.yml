name: Validate Collector Python 3.12

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/46-raildatacollector-python-312

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: fix/46-raildatacollector-python-312
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Regenerate lock file
        working-directory: raildatacollector
        run: uv lock --python 3.12

      - name: Install dependencies
        working-directory: raildatacollector
        run: uv pip install --system -e ".[dev]"

      - name: Run Ruff
        working-directory: raildatacollector
        run: ruff check app tests

      - name: Run Black
        working-directory: raildatacollector
        run: black --check app tests

      - name: Run mypy
        working-directory: raildatacollector
        run: mypy app

      - name: Run tests
        working-directory: raildatacollector
        run: pytest --cov=app --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t raildatacollector:python312 raildatacollector

      - name: Commit regenerated lock
        run: |
          if git diff --quiet -- raildatacollector/uv.lock; then
            echo "Lock file is already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raildatacollector/uv.lock
          git commit -m 'chore(collector): regenerate lock for Python 3.12'
          git push origin HEAD:fix/46-raildatacollector-python-312
