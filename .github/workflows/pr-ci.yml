name: Pull Request CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'gateway/**'
      - 'k8s/**'
      - 'tools/prepare_railmap.py'
      - '.github/workflows/pr-ci.yml'

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check app tests
      - run: black --check app tests
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type-check
        shell: bash
        run: |
          set -o pipefail
          npm run type-check 2>&1 | tee typecheck.log
      - name: Upload type-check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck-log
          path: frontend/typecheck.log
          if-no-files-found: error
      - run: npm run test -- --coverage --passWithNoTests
      - run: npm run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - name: Validate Kubernetes YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path('k8s').rglob('*.yaml'):
              list(yaml.safe_load_all(path.read_text()))
              print(path)
          PY
        env:
          PYTHONUNBUFFERED: '1'

  prepare-railmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/prepare_railmap.py
      - uses: actions/upload-artifact@v4
        with:
          name: regression-free-railmap
          path: generated/RailMap.tsx
          if-no-files-found: error
