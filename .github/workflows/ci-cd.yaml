# Thailand Railway Digital Twin - CI/CD Pipeline

name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'simulation/**'
      - 'frontend/**'
      - 'raildatacollector/**'
      - 'raildbsetup/**'
      - 'gateway/**'
      - 'k8s/**'
      - '.github/workflows/ci-cd.yaml'
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: 'Force rebuild and push all services'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  ##############################################################
  # 1. Detect Changes
  ##############################################################
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      simulation: ${{ steps.changes.outputs.simulation }}
      frontend: ${{ steps.changes.outputs.frontend }}
      raildatacollector: ${{ steps.changes.outputs.raildatacollector }}
      raildbsetup: ${{ steps.changes.outputs.raildbsetup }}
      gateway: ${{ steps.changes.outputs.gateway }}
      k8s: ${{ steps.changes.outputs.k8s }}
      build-matrix: ${{ steps.changes.outputs.build-matrix }}
      has-build-changes: ${{ steps.changes.outputs.has-build-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.rebuild_all }}" = "true" ]; then
            echo "Force rebuilding all components due to workflow_dispatch input"
            echo "simulation=true"           >> $GITHUB_OUTPUT
            echo "frontend=true"          >> $GITHUB_OUTPUT
            echo "raildatacollector=true" >> $GITHUB_OUTPUT
            echo "k8s=true"               >> $GITHUB_OUTPUT
            echo "raildbsetup=true"       >> $GITHUB_OUTPUT
            echo "gateway=true"           >> $GITHUB_OUTPUT
            echo 'build-matrix=["simulation","frontend","raildatacollector","gateway","raildbsetup"]' >> $GITHUB_OUTPUT
            echo "has-build-changes=true"                                  >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Query GitHub API to find the last successful commit SHA of this workflow on the current branch
            LAST_SUCCESSFUL_SHA=$(gh run list --branch "${{ github.ref_name }}" --status success --workflow "${{ github.workflow }}" --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || echo "")
            if [ -n "$LAST_SUCCESSFUL_SHA" ]; then
              BASE_COMMIT="$LAST_SUCCESSFUL_SHA"
              echo "Comparing against last successful commit: $BASE_COMMIT"
            elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              BASE_COMMIT="${{ github.event.before }}"
              echo "Comparing against previous commit: $BASE_COMMIT"
            else
              BASE_COMMIT="HEAD^"
              echo "Comparing against HEAD^: $BASE_COMMIT"
            fi
          else
            BASE_COMMIT="origin/${{ github.base_ref }}"
          fi

          if ! git cat-file -e "$BASE_COMMIT" 2>/dev/null; then
            echo "Base commit not found, rebuilding all"
            echo "simulation=true"           >> $GITHUB_OUTPUT
            echo "frontend=true"          >> $GITHUB_OUTPUT
            echo "raildatacollector=true" >> $GITHUB_OUTPUT
            echo "k8s=true"               >> $GITHUB_OUTPUT
            echo "raildbsetup=true"       >> $GITHUB_OUTPUT
            echo "gateway=true"           >> $GITHUB_OUTPUT
            echo 'build-matrix=["simulation","frontend","raildatacollector","gateway","raildbsetup"]' >> $GITHUB_OUTPUT
            echo "has-build-changes=true"                                  >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_COMMIT" "${{ github.sha }}")

          WORKFLOW_CHANGED=false
          echo "$CHANGED" | grep -q "^.github/workflows/ci-cd.yaml" && WORKFLOW_CHANGED=true

          SIMULATION_CHANGED=false
          FRONTEND_CHANGED=false
          RAILDATACOLLECTOR_CHANGED=false
          RAILDBSETUP_CHANGED=false
          K8S_CHANGED=false
          GATEWAY_CHANGED=false

          (echo "$CHANGED" | grep -q "^simulation/"           || $WORKFLOW_CHANGED) && SIMULATION_CHANGED=true
          (echo "$CHANGED" | grep -q "^frontend/"          || $WORKFLOW_CHANGED) && FRONTEND_CHANGED=true
          (echo "$CHANGED" | grep -q "^raildatacollector/" || $WORKFLOW_CHANGED) && RAILDATACOLLECTOR_CHANGED=true
          (echo "$CHANGED" | grep -q "^raildbsetup/" || $WORKFLOW_CHANGED) && RAILDBSETUP_CHANGED=true
          (echo "$CHANGED" | grep -q "^gateway/" || $WORKFLOW_CHANGED) && GATEWAY_CHANGED=true
          echo "$CHANGED" | grep -q "^k8s/" && K8S_CHANGED=true

          echo "simulation=$SIMULATION_CHANGED"                   >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND_CHANGED"                 >> $GITHUB_OUTPUT
          echo "raildatacollector=$RAILDATACOLLECTOR_CHANGED" >> $GITHUB_OUTPUT
          echo "raildbsetup=$RAILDBSETUP_CHANGED"           >> $GITHUB_OUTPUT
          echo "gateway=$GATEWAY_CHANGED"                   >> $GITHUB_OUTPUT
          echo "k8s=$K8S_CHANGED"                           >> $GITHUB_OUTPUT

          MATRIX=()
          $SIMULATION_CHANGED           && MATRIX+=("\"simulation\"")
          $FRONTEND_CHANGED          && MATRIX+=("\"frontend\"")
          $RAILDATACOLLECTOR_CHANGED && MATRIX+=("\"raildatacollector\"")
          $RAILDBSETUP_CHANGED && MATRIX+=("\"raildbsetup\"")
          $GATEWAY_CHANGED && MATRIX+=("\"gateway\"")

          if [ ${#MATRIX[@]} -gt 0 ]; then
            MATRIX_JSON="[$(IFS=,; echo "${MATRIX[*]}")]"
            echo "build-matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
            echo "has-build-changes=true"    >> $GITHUB_OUTPUT
          else
            echo "build-matrix=[]"         >> $GITHUB_OUTPUT
            echo "has-build-changes=false" >> $GITHUB_OUTPUT
          fi

  # "Changed: simulation=$SIMULATION_CHANGED frontend=$FRONTEND_CHANGED raildatacollector=$RAILDATACOLLECTOR_CHANGED gateway=$GATEWAY_CHANGED k8s=$K8S_CHANGED"

  ##############################################################
  # 2a. Simulation CI  (parallel with frontend-ci)
  ##############################################################
  simulation-ci:
    name: Simulation CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.simulation == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./simulation

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Run linting (Ruff)
        run: ruff check app tests

      - name: Run formatting check (Black)
        run: black --check app tests

      - name: Run type checking (mypy)
        run: mypy app

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./simulation/coverage.xml
          flags: simulation

  ##############################################################
  # 2b. Raildatacollector CI  (parallel with simulation-ci)
  ##############################################################
  raildatacollector-ci:
    name: Raildatacollector CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.raildatacollector == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./raildatacollector

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-rdc-${{ hashFiles('raildatacollector/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-rdc-

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Run linting (Ruff)
        run: ruff check app tests

      - name: Run formatting check (Black)
        run: black --check app tests

      - name: Run type checking (mypy)
        run: mypy app

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./raildatacollector/coverage.xml
          flags: raildatacollector

  ##############################################################
  # 2c. RailDbSetup CI
  ##############################################################
  raildbsetup-ci:
    name: RailDbSetup CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.raildbsetup == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./raildbsetup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-rds-${{ hashFiles('raildbsetup/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-rds-

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Run linting (Ruff)
        run: ruff check app tests

      - name: Run formatting check (Black)
        run: black --check app tests

      - name: Run type checking (mypy)
        run: mypy app

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./raildbsetup/coverage.xml
          flags: raildbsetup

  ##############################################################
  # 2d. Gateway CI  (parallel with other Python services)
  ##############################################################
  gateway-ci:
    name: Gateway CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-gateway-${{ hashFiles('gateway/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-gateway-

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"

      - name: Run linting (Ruff)
        run: ruff check app tests

      - name: Run formatting check (Black)
        run: black --check app tests

      - name: Run type checking (mypy)
        run: mypy app

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./gateway/coverage.xml
          flags: gateway

  ##############################################################
  # 2e. Frontend CI  (parallel with simulation-ci)
  ##############################################################
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm run test -- --coverage --passWithNoTests

      - name: Build
        run: npm run build

  ##############################################################
  # 3. Build & Push Docker Images  (parallel matrix)
  ##############################################################
  build-images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: [detect-changes, simulation-ci, raildatacollector-ci, raildbsetup-ci, gateway-ci, frontend-ci]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.has-build-changes == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJson(needs.detect-changes.outputs.build-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image repo
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          DATE_TAG=$(date +'%Y%m%d-%H%M')
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "DATE_TAG=$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate frontend build secrets
        if: matrix.component == 'frontend'
        env:
          CARTO_API: ${{ secrets.CARTO_API }}
        run: |
          if [ -z "$CARTO_API" ]; then
            echo "Required GitHub Actions secret CARTO_API is not configured"
            exit 1
          fi

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.component }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.component }}:${{ steps.tags.outputs.DATE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.component }}:${{ steps.tags.outputs.SHORT_SHA }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.rthfi.com
            NEXT_PUBLIC_WS_URL=wss://api.rthfi.com
            NEXT_PUBLIC_CARTO_API_KEY=${{ matrix.component == 'frontend' && secrets.CARTO_API || '' }}
          platforms: linux/amd64
          provenance: false

  ##############################################################
  # 4. Deploy to K3s
  ##############################################################
  deploy:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: [detect-changes, simulation-ci, raildatacollector-ci, raildbsetup-ci, gateway-ci, frontend-ci, build-images]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.build-images.result == 'success' || needs.detect-changes.outputs.k8s == 'true')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Configure kubeconfig
        run: |
          set -eu
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Validate cluster prerequisites
        run: |
          set -eu
          kubectl apply -f k8s/namespace.yaml
          for secret in ghcr-registry-secret postgres-secrets raildbsetup-secrets simulation-secrets raildatacollector-secrets; do
            kubectl -n railway get "secret/$secret" >/dev/null || {
              echo "Missing required pre-provisioned secret railway/$secret" >&2
              exit 1
            }
          done
          if kubectl -n railway get deployment/raildbsetup >/dev/null 2>&1; then
            echo "RAILDBSETUP_EXISTED=true" >> "$GITHUB_ENV"
          else
            echo "RAILDBSETUP_EXISTED=false" >> "$GITHUB_ENV"
          fi

      - name: Apply manifests and deploy reference-data service
        env:
          RAILDBSETUP_CHANGED: ${{ needs.detect-changes.outputs.raildbsetup }}
          K8S_CHANGED: ${{ needs.detect-changes.outputs.k8s }}
        run: |
          set -eu
          kubectl apply -k k8s

          # Manifests keep the canonical :latest image. A restart is required
          # because setting the same mutable tag does not change the pod template.
          if [ "$RAILDBSETUP_CHANGED" = "true" ] || { [ "$K8S_CHANGED" = "true" ] && [ "$RAILDBSETUP_EXISTED" = "true" ]; }; then
            kubectl -n railway rollout restart deployment/raildbsetup
          fi

          kubectl -n railway rollout status deployment/postgres --timeout=10m
          kubectl -n railway rollout status deployment/redis --timeout=5m

      - name: Queue maps and derived movement-plan rebuild
        if: env.RAILDBSETUP_EXISTED == 'true' && (needs.detect-changes.outputs.raildbsetup == 'true' || needs.detect-changes.outputs.k8s == 'true')
        run: |
          job="$(kubectl create -f k8s/raildbsetup/rebuild-job.yaml -o name)"
          echo "Queued $job; rebuild now runs independently inside k3s"

      - name: Diagnose deployment queueing failure
        if: failure()
        run: |
          echo "raildbsetup pod status:"
          kubectl -n railway get pods -l app.kubernetes.io/name=raildbsetup -o wide || true
          echo "raildbsetup container state and restart count:"
          kubectl -n railway get pods -l app.kubernetes.io/name=raildbsetup \
            -o jsonpath='{range .items[*]}{.metadata.name}{" restart="}{.status.containerStatuses[0].restartCount}{" current="}{.status.containerStatuses[0].state}{" last="}{.status.containerStatuses[0].lastState}{"\n"}{end}' || true
          echo "raildbsetup logs:"
          kubectl -n railway logs deployment/raildbsetup --tail=200 || true
          echo "raildbsetup previous container logs (if it restarted):"
          kubectl -n railway logs deployment/raildbsetup --previous --tail=200 || true
          echo "raildbsetup resource usage:"
          kubectl -n railway top pod -l app.kubernetes.io/name=raildbsetup --containers || true
          echo "reference-data trigger jobs:"
          kubectl -n railway get jobs -l app.kubernetes.io/name=raildbsetup-rebuild || true
          echo "recent namespace events:"
          kubectl -n railway get events --sort-by=.lastTimestamp | tail -50 || true

      - name: Deploy application services
        env:
          SIMULATION_CHANGED: ${{ needs.detect-changes.outputs.simulation }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          COLLECTOR_CHANGED: ${{ needs.detect-changes.outputs.raildatacollector }}
          GATEWAY_CHANGED: ${{ needs.detect-changes.outputs.gateway }}
          K8S_CHANGED: ${{ needs.detect-changes.outputs.k8s }}
          REFERENCE_DATA_CHANGED: ${{ needs.detect-changes.outputs.raildbsetup }}
        run: |
          set -eu

          deploy_component() {
            component="$1"
            changed="$2"
            if [ "$changed" = "true" ] || { [ "$K8S_CHANGED" = "true" ] && [ "$RAILDBSETUP_EXISTED" = "true" ]; }; then
              kubectl -n railway rollout restart "deployment/$component"
            fi
          }

          deploy_component simulation "$SIMULATION_CHANGED"
          deploy_component gateway "$GATEWAY_CHANGED"
          deploy_component raildatacollector "$COLLECTOR_CHANGED"
          deploy_component frontend "$FRONTEND_CHANGED"

          if [ "$REFERENCE_DATA_CHANGED" = "true" ] && [ "$SIMULATION_CHANGED" != "true" ]; then
            kubectl -n railway rollout restart deployment/simulation
          fi

          kubectl -n railway rollout status deployment/simulation --timeout=15m
          kubectl -n railway rollout status deployment/gateway --timeout=10m
          kubectl -n railway rollout status deployment/raildatacollector --timeout=10m
          kubectl -n railway rollout status deployment/frontend --timeout=10m

  ##############################################################
  # 5. Notifications
  ##############################################################
  notify:
    name: Send Notifications
    needs: [detect-changes, simulation-ci, raildatacollector-ci, raildbsetup-ci, gateway-ci, frontend-ci, build-images, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.detect-changes.outputs.has-build-changes }}" != "true" ] && \
             [ "${{ needs.detect-changes.outputs.k8s }}" != "true" ]; then
            echo "status=⏭️ No Changes" >> $GITHUB_OUTPUT
            echo "emoji=⏭️" >> $GITHUB_OUTPUT
          elif [ "${{ needs.simulation-ci.result }}" = "failure" ] || \
               [ "${{ needs.raildatacollector-ci.result }}" = "failure" ] || \
               [ "${{ needs.raildbsetup-ci.result }}" = "failure" ] || \
              [ "${{ needs.gateway-ci.result }}" = "failure" ] || \
               [ "${{ needs.frontend-ci.result }}" = "failure" ] || \
               [ "${{ needs.build-images.result }}" = "failure" ] || \
               [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "status=❌ Failed" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy.result }}" = "success" ] || \
               [ "${{ needs.build-images.result }}" = "success" ]; then
            echo "status=✅ Success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build-images.result }}" = "cancelled" ]; then
            echo "status=⏹️ Cancelled" >> $GITHUB_OUTPUT
            echo "emoji=⏹️" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ Unknown" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ steps.status.outputs.emoji }} *RailTwin CI/CD Pipeline*

            *Branch:* `${{ github.ref_name }}`
            *Trigger:* ${{ github.event_name }}
            *Status:* ${{ steps.status.outputs.status }}

            *Results:*
            • Detect Changes: ${{ needs.detect-changes.result == 'success' && '✅' || '❌' }}
