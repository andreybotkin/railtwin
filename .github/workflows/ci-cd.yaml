# Thailand Railway Digital Twin - CI/CD Pipeline

name: CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'simulation/**'
      - 'frontend/**'
      - 'raildatacollector/**'
      - 'gateway/**'
      - 'k8s/**'
      - '.github/workflows/ci-cd.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'simulation/**'
      - 'raildatacollector/**'
      - 'gateway/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  ##############################################################
  # 1. Detect Changes
  ##############################################################
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      simulation: ${{ steps.changes.outputs.simulation }}
      frontend: ${{ steps.changes.outputs.frontend }}
      raildatacollector: ${{ steps.changes.outputs.raildatacollector }}
      gateway: ${{ steps.changes.outputs.gateway }}
      k8s: ${{ steps.changes.outputs.k8s }}
      build-matrix: ${{ steps.changes.outputs.build-matrix }}
      has-build-changes: ${{ steps.changes.outputs.has-build-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        run: |
          set -e

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              BASE_COMMIT="${{ github.event.before }}"
            else
              BASE_COMMIT="HEAD^"
            fi
          else
            BASE_COMMIT="origin/${{ github.base_ref }}"
          fi

          if ! git cat-file -e "$BASE_COMMIT" 2>/dev/null; then
            echo "Base commit not found, rebuilding all"
            echo "simulation=true"           >> $GITHUB_OUTPUT
            echo "frontend=true"          >> $GITHUB_OUTPUT
            echo "raildatacollector=true" >> $GITHUB_OUTPUT
            echo "k8s=true"               >> $GITHUB_OUTPUT
            echo "gateway=true"           >> $GITHUB_OUTPUT
            echo 'build-matrix=["simulation","frontend","raildatacollector","gateway"]' >> $GITHUB_OUTPUT
            echo "has-build-changes=true"                                  >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_COMMIT" "${{ github.sha }}")

          WORKFLOW_CHANGED=false
          echo "$CHANGED" | grep -q "^.github/workflows/ci-cd.yaml" && WORKFLOW_CHANGED=true

          SIMULATION_CHANGED=false
          FRONTEND_CHANGED=false
          RAILDATACOLLECTOR_CHANGED=false
          K8S_CHANGED=false
          GATEWAY_CHANGED=false

          (echo "$CHANGED" | grep -q "^simulation/"           || $WORKFLOW_CHANGED) && SIMULATION_CHANGED=true
          (echo "$CHANGED" | grep -q "^frontend/"          || $WORKFLOW_CHANGED) && FRONTEND_CHANGED=true
          (echo "$CHANGED" | grep -q "^raildatacollector/" || $WORKFLOW_CHANGED) && RAILDATACOLLECTOR_CHANGED=true
          (echo "$CHANGED" | grep -q "^gateway/" || $WORKFLOW_CHANGED) && GATEWAY_CHANGED=true
          echo "$CHANGED" | grep -q "^k8s/" && K8S_CHANGED=true

          echo "simulation=$SIMULATION_CHANGED"                   >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND_CHANGED"                 >> $GITHUB_OUTPUT
          echo "raildatacollector=$RAILDATACOLLECTOR_CHANGED" >> $GITHUB_OUTPUT
          echo "gateway=$GATEWAY_CHANGED"                   >> $GITHUB_OUTPUT
          echo "k8s=$K8S_CHANGED"                           >> $GITHUB_OUTPUT

          MATRIX=()
          $SIMULATION_CHANGED           && MATRIX+=("\"simulation\"")
          $FRONTEND_CHANGED          && MATRIX+=("\"frontend\"")
          $RAILDATACOLLECTOR_CHANGED && MATRIX+=("\"raildatacollector\"")
          $GATEWAY_CHANGED && MATRIX+=("\"gateway\"")

          if [ ${#MATRIX[@]} -gt 0 ]; then
            MATRIX_JSON="[$(IFS=,; echo "${MATRIX[*]}")]"
            echo "build-matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
            echo "has-build-changes=true"    >> $GITHUB_OUTPUT
          else
            echo "build-matrix=[]"         >> $GITHUB_OUTPUT
            echo "has-build-changes=false" >> $GITHUB_OUTPUT
          fi

  # "Changed: simulation=$SIMULATION_CHANGED frontend=$FRONTEND_CHANGED raildatacollector=$RAILDATACOLLECTOR_CHANGED gateway=$GATEWAY_CHANGED k8s=$K8S_CHANGED"

  ##############################################################
  # 2a. Simulation CI  (parallel with frontend-ci)
  ##############################################################
  simulation-ci:
    name: Simulation CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.simulation == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./simulation

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linting (Ruff)
        run: ruff check app tests

      - name: Run formatting check (Black)
        run: black --check app tests

      - name: Run type checking (mypy)
        run: mypy app

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./simulation/coverage.xml
          flags: simulation

  ##############################################################
  # 2b. Raildatacollector CI  (parallel with simulation-ci)
  ##############################################################
  raildatacollector-ci:
    name: Raildatacollector CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.raildatacollector == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./raildatacollector

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rdc-${{ hashFiles('raildatacollector/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-rdc-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linting (Ruff)
        run: ruff check app tests

      - name: Run formatting check (Black)
        run: black --check app tests

      - name: Run type checking (mypy)
        run: mypy app

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./raildatacollector/coverage.xml
          flags: raildatacollector

  ##############################################################
  # 2c. Frontend CI  (parallel with simulation-ci)
  ##############################################################
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm run test -- --coverage --passWithNoTests

      - name: Build
        run: npm run build

  ##############################################################
  # 3. Build & Push Docker Images  (parallel matrix)
  ##############################################################
  build-images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: [detect-changes, simulation-ci, raildatacollector-ci, frontend-ci]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.has-build-changes == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJson(needs.detect-changes.outputs.build-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image repo
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          DATE_TAG=$(date +'%Y%m%d-%H%M')
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "DATE_TAG=$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.component }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.component }}:${{ steps.tags.outputs.DATE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.component }}:${{ steps.tags.outputs.SHORT_SHA }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.WS_URL }}
          platforms: linux/amd64
          provenance: false

  ##############################################################
  # 4. Deploy to K3s
  ##############################################################
