# Thailand Railway Digital Twin - CI/CD Pipeline

name: CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/ci-cd.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  ##############################################################
  # 1. Detect Changes
  ##############################################################
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      k8s: ${{ steps.changes.outputs.k8s }}
      build-matrix: ${{ steps.changes.outputs.build-matrix }}
      has-build-changes: ${{ steps.changes.outputs.has-build-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        run: |
          set -e

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              BASE_COMMIT="${{ github.event.before }}"
            else
              BASE_COMMIT="HEAD^"
            fi
          else
            BASE_COMMIT="origin/${{ github.base_ref }}"
          fi

          if ! git cat-file -e "$BASE_COMMIT" 2>/dev/null; then
            echo "Base commit not found, rebuilding all"
            echo "backend=true"  >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "k8s=true"      >> $GITHUB_OUTPUT
            echo 'build-matrix=["backend","frontend"]' >> $GITHUB_OUTPUT
            echo "has-build-changes=true"              >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_COMMIT" "${{ github.sha }}")

          WORKFLOW_CHANGED=false
          echo "$CHANGED" | grep -q "^.github/workflows/ci-cd.yaml" && WORKFLOW_CHANGED=true

          BACKEND_CHANGED=false
          FRONTEND_CHANGED=false
          K8S_CHANGED=false

          (echo "$CHANGED" | grep -q "^backend/"  || $WORKFLOW_CHANGED) && BACKEND_CHANGED=true
          (echo "$CHANGED" | grep -q "^frontend/" || $WORKFLOW_CHANGED) && FRONTEND_CHANGED=true
          echo "$CHANGED" | grep -q "^k8s/" && K8S_CHANGED=true

          echo "backend=$BACKEND_CHANGED"   >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND_CHANGED" >> $GITHUB_OUTPUT
          echo "k8s=$K8S_CHANGED"           >> $GITHUB_OUTPUT

          MATRIX=()
          $BACKEND_CHANGED  && MATRIX+=("\"backend\"")
          $FRONTEND_CHANGED && MATRIX+=("\"frontend\"")

          if [ ${#MATRIX[@]} -gt 0 ]; then
            MATRIX_JSON="[$(IFS=,; echo "${MATRIX[*]}")]"
            echo "build-matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
            echo "has-build-changes=true"    >> $GITHUB_OUTPUT
          else
            echo "build-matrix=[]"         >> $GITHUB_OUTPUT
            echo "has-build-changes=false" >> $GITHUB_OUTPUT
          fi

          echo "Changed: backend=$BACKEND_CHANGED frontend=$FRONTEND_CHANGED k8s=$K8S_CHANGED"

  ##############################################################
  # 2a. Backend CI  (parallel with frontend-ci)
  ##############################################################
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linting (Ruff)
        run: ruff check app tests

      - name: Run formatting check (Black)
        run: black --check app tests

      - name: Run type checking (mypy)
        run: mypy app

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend

  ##############################################################
  # 2b. Frontend CI  (parallel with backend-ci)
  ##############################################################
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm run test -- --coverage --passWithNoTests

      - name: Build
        run: npm run build

  ##############################################################
  # 3. Build & Push Docker Images  (parallel matrix)
  ##############################################################
  build-images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-ci, frontend-ci]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.has-build-changes == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJson(needs.detect-changes.outputs.build-matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          DATE_TAG=$(date +'%Y%m%d-%H%M')
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}:${{ steps.tags.outputs.DATE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}:${{ steps.tags.outputs.SHORT_SHA }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.WS_URL }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          platforms: linux/amd64
          provenance: false

  ##############################################################
  # 4. Deploy to K3s
  ##############################################################
  deploy:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: [detect-changes, build-images]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-images.result != 'failure' &&
      needs.build-images.result != 'cancelled' &&
      (needs.build-images.result == 'success' || needs.detect-changes.outputs.k8s == 'true')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to K3s
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/network-policy.yaml

          kubectl apply -f k8s/postgres/deployment.yaml
          kubectl apply -f k8s/postgres/service.yaml
          kubectl apply -f k8s/redis/deployment.yaml
          kubectl apply -f k8s/redis/service.yaml

          kubectl apply -f k8s/backend/configmap.yaml
          kubectl apply -f k8s/backend/secrets.yaml

          kubectl apply -f k8s/backend/deployment.yaml
          kubectl apply -f k8s/backend/service.yaml
          kubectl apply -f k8s/backend/hpa.yaml

          kubectl apply -f k8s/frontend/deployment.yaml
          kubectl apply -f k8s/frontend/service.yaml
          kubectl apply -f k8s/frontend/ingress.yaml

          if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
            kubectl rollout restart deployment/backend -n railway
            kubectl rollout status deployment/backend -n railway --timeout=300s
          fi
          if [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
            kubectl rollout restart deployment/frontend -n railway
            kubectl rollout status deployment/frontend -n railway --timeout=300s
          fi

  ##############################################################
  # 5. Notifications
  ##############################################################
  notify:
    name: Send Notifications
    needs: [detect-changes, backend-ci, frontend-ci, build-images, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.detect-changes.outputs.has-build-changes }}" != "true" ] && \
             [ "${{ needs.detect-changes.outputs.k8s }}" != "true" ]; then
            echo "status=⏭️ No Changes" >> $GITHUB_OUTPUT
            echo "emoji=⏭️" >> $GITHUB_OUTPUT
          elif [ "${{ needs.backend-ci.result }}" = "failure" ] || \
               [ "${{ needs.frontend-ci.result }}" = "failure" ] || \
               [ "${{ needs.build-images.result }}" = "failure" ] || \
               [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "status=❌ Failed" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy.result }}" = "success" ] || \
               [ "${{ needs.build-images.result }}" = "success" ]; then
            echo "status=✅ Success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy.result }}" = "cancelled" ] || \
               [ "${{ needs.build-images.result }}" = "cancelled" ]; then
            echo "status=⏹️ Cancelled" >> $GITHUB_OUTPUT
            echo "emoji=⏹️" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ Unknown" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ vars.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ steps.status.outputs.emoji }} *RailTwin CI/CD Pipeline*

            *Branch:* `${{ github.ref_name }}`
            *Trigger:* ${{ github.event_name }}
            *Status:* ${{ steps.status.outputs.status }}

            *Results:*
            • Detect Changes: ${{ needs.detect-changes.result == 'success' && '✅' || '❌' }}
            • Backend CI: ${{ needs.backend-ci.result == 'success' && '✅' || needs.backend-ci.result == 'failure' && '❌' || needs.backend-ci.result == 'skipped' && '⏭️' || '⚠️' }}
            • Frontend CI: ${{ needs.frontend-ci.result == 'success' && '✅' || needs.frontend-ci.result == 'failure' && '❌' || needs.frontend-ci.result == 'skipped' && '⏭️' || '⚠️' }}
            • Build Images: ${{ needs.build-images.result == 'success' && '✅' || needs.build-images.result == 'failure' && '❌' || needs.build-images.result == 'skipped' && '⏭️' || '⚠️' }}
            • Deploy: ${{ needs.deploy.result == 'success' && '✅' || needs.deploy.result == 'failure' && '❌' || needs.deploy.result == 'skipped' && '⏭️' || '⚠️' }}

            ${{ github.event_name == 'push' && format('*Commit:* `{0}`', github.event.head_commit.message) || '' }}
            ${{ github.event_name == 'push' && format('*Author:* {0}', github.event.head_commit.author.name) || '' }}

            🔗 [View Pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
