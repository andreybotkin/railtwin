  #         fi

  ##############################################################
  # 5. Notifications
  ##############################################################
  notify:
    name: Send Notifications
    needs: [detect-changes, simulation-ci, raildatacollector-ci, frontend-ci, build-images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.detect-changes.outputs.has-build-changes }}" != "true" ] && \
             [ "${{ needs.detect-changes.outputs.k8s }}" != "true" ]; then
            echo "status=⏭️ No Changes" >> $GITHUB_OUTPUT
            echo "emoji=⏭️" >> $GITHUB_OUTPUT
          elif [ "${{ needs.simulation-ci.result }}" = "failure" ] || \
               [ "${{ needs.raildatacollector-ci.result }}" = "failure" ] || \
               [ "${{ needs.frontend-ci.result }}" = "failure" ] || \
               [ "${{ needs.build-images.result }}" = "failure" ]; then
            echo "status=❌ Failed" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build-images.result }}" = "success" ]; then
            echo "status=✅ Success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build-images.result }}" = "cancelled" ]; then
            echo "status=⏹️ Cancelled" >> $GITHUB_OUTPUT
            echo "emoji=⏹️" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ Unknown" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ steps.status.outputs.emoji }} *RailTwin CI/CD Pipeline*

            *Branch:* `${{ github.ref_name }}`
            *Trigger:* ${{ github.event_name }}
            *Status:* ${{ steps.status.outputs.status }}

            *Results:*
            • Detect Changes: ${{ needs.detect-changes.result == 'success' && '✅' || '❌' }}
            • Simulation CI: ${{ needs.simulation-ci.result == 'success' && '✅' || needs.simulation-ci.result == 'failure' && '❌' || needs.simulation-ci.result == 'skipped' && '⏭️' || '⚠️' }}
            • Raildatacollector CI: ${{ needs.raildatacollector-ci.result == 'success' && '✅' || needs.raildatacollector-ci.result == 'failure' && '❌' || needs.raildatacollector-ci.result == 'skipped' && '⏭️' || '⚠️' }}
            • Frontend CI: ${{ needs.frontend-ci.result == 'success' && '✅' || needs.frontend-ci.result == 'failure' && '❌' || needs.frontend-ci.result == 'skipped' && '⏭️' || '⚠️' }}
            • Build Images: ${{ needs.build-images.result == 'success' && '✅' || needs.build-images.result == 'failure' && '❌' || needs.build-images.result == 'skipped' && '⏭️' || '⚠️' }}

            ${{ github.event_name == 'push' && format('*Commit:* `{0}`', github.event.head_commit.message) || '' }}
            ${{ github.event_name == 'push' && format('*Author:* {0}', github.event.head_commit.author.name) || '' }}

            🔗 [View Pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
