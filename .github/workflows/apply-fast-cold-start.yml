name: Apply Fast Cold Start

on:
  push:
    branches:
      - perf/47-fast-cold-start

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/47-fast-cold-start
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply repository changes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          payload = ''''''
          Path('/tmp/apply_fast.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          python /tmp/apply_fast.py

      - name: Install gateway dependencies
        run: |
          python -m pip install uv
          cd gateway
          uv pip install --system -e ".[dev]"

      - name: Format and validate gateway
        run: |
          cd gateway
          black app tests
          ruff check app tests
          mypy app
          pytest --cov=app --cov-report=term-missing

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Format frontend changes
        working-directory: frontend
        run: |
          npx prettier --write \
            src/app/layout.tsx \
            src/components/Map/RailMap.tsx \
            src/components/Map/LeafletTracksLayer.tsx \
            src/lib/hooks/useTrajectoryStream.ts \
            src/lib/websocket.ts \
            src/types/index.ts

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run type-check
          npm run test -- --coverage --passWithNoTests
          npm run build

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'perf: accelerate map and train cold start'
          git push origin HEAD:perf/47-fast-cold-start
