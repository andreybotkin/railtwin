name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-simulation:
    name: Lint Simulation (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [simulation, gateway, raildatacollector, raildbsetup]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check ${{ matrix.service }}/

      - name: Ruff format check
        run: ruff format --check ${{ matrix.service }}/

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  test-simulation:
    name: Test Simulation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./simulation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test -- --passWithNoTests

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-simulation, lint-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8002
          NEXT_PUBLIC_WS_URL: ws://localhost:8002
