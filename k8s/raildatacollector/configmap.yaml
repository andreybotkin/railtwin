apiVersion: v1
kind: ConfigMap
metadata:
  name: raildatacollector-config
  namespace: railway
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DEBUG: "false"
  # Scheduler
  DELAYS_UPDATE_INTERVAL_SECONDS: "1800"
  SCHEDULE_UPDATE_HOUR: "3"
  SCHEDULE_UPDATE_MINUTE: "0"
  # Remote KML source (fallback when local file is absent)
  KML_REMOTE_URL: "https://www.google.com/maps/d/kml?mid=1E6wO3YeI2OZwvSaRGc-pPbUEYchbFdY&forcekml=1"
  # TTS socket.io server
  TTS_SERVER_URL: "https://ttsview.railway.co.th:5000"
