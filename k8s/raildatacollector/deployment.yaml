apiVersion: apps/v1
kind: Deployment
metadata:
  name: raildatacollector
  namespace: railway
  labels:
    app.kubernetes.io/name: raildatacollector
    app.kubernetes.io/component: collector
spec:
  # Single replica — collection jobs must not run concurrently
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: raildatacollector
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raildatacollector
        app.kubernetes.io/component: collector
    spec:
      imagePullSecrets:
        - name: ghcr-registry-secret
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for postgres..."
                sleep 3
              done
              echo "Postgres is ready"
        - name: wait-for-raildbsetup
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://raildbsetup-service:8003/health >/dev/null 2>&1; do
                echo "Waiting for raildbsetup service..."
                sleep 5
              done
              echo "Raildbsetup service is available"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-service 6379; do
                echo "Waiting for redis..."
                sleep 3
              done
              echo "Redis is ready"
      containers:
        - name: raildatacollector
          image: ghcr.io/andreybotkin/railtwin/raildatacollector:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: raildatacollector-config
            - secretRef:
                name: raildatacollector-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
