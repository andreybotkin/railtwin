apiVersion: apps/v1
kind: Deployment
metadata:
  name: raildatacollector
  namespace: railway
  labels:
    app.kubernetes.io/name: raildatacollector
    app.kubernetes.io/component: collector
spec:
  # Single replica — collection jobs must not run concurrently
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: raildatacollector
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raildatacollector
        app.kubernetes.io/component: collector
    spec:
      containers:
        - name: raildatacollector
          image: raildatacollector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: raildatacollector-config
            - secretRef:
                name: raildatacollector-secrets
          env:
            - name: KML_LOCAL_PATH
              value: /app/railroad/20260410RailwayMapofThailand.kml
            - name: SCHEDULE_DATA_DIR
              value: /app/schedule
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts: []
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      volumes: []
