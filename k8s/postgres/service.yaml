# PostgreSQL Service pointing to existing deployment
# Assumes PostgreSQL with PostGIS is already running in the cluster
#
# To find the correct selector for your PostgreSQL deployment:
# 1. Run: kubectl get pods -n railway -l app=postgres --show-labels
# 2. Use the appropriate label selector from the existing PostgreSQL pods
# 3. Common labels include: app=postgres, app.kubernetes.io/name=postgresql

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: railway
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    # Update this selector to match your existing PostgreSQL deployment
    # Example selectors based on common PostgreSQL Helm charts:
    # - For Bitnami PostgreSQL: app.kubernetes.io/name: postgresql
    # - For manual deployment: app: postgres
    app: postgres
