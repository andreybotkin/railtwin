apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation
  namespace: railway
  labels:
    app.kubernetes.io/name: simulation
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simulation
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulation
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for postgres..."
                sleep 3
              done
              echo "Postgres is ready"
        - name: wait-for-raildbsetup
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://raildbsetup-service:8003/ready 2>/dev/null | grep -q '"status":"ready"'; do
                echo "Waiting for raildbsetup to finish DB setup..."
                sleep 5
              done
              echo "Raildbsetup is ready"
      containers:
        - name: simulation
          image: ghcr.io/andreybotkin/railtwin/simulation:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: simulation-config
            - secretRef:
                name: simulation-secrets
          startupProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: simulation
                topologyKey: kubernetes.io/hostname
