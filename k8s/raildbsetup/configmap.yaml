apiVersion: v1
kind: ConfigMap
metadata:
  name: raildbsetup-config
  namespace: railway
  labels:
    app.kubernetes.io/name: raildbsetup
    app.kubernetes.io/component: setup
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  DEBUG: "false"
  KML_LOCAL_PATH: "/app/railroad/20260428RailwayMapofThailand.kml"
  STATIONS_KML_PATH: "/app/railroad/20260428Thai_railway_stations.kml"
  SCHEDULE_RAW_DIR: "/app/schedule/raw"
  SCHEDULE_SEED_PATH: "/app/schedule/schedules_seed.json"
  SETUP_PORT: "8003"
