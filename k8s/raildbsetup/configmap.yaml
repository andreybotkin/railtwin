apiVersion: v1
kind: ConfigMap
metadata:
  name: raildbsetup-config
  namespace: railway
  labels:
    app.kubernetes.io/name: raildbsetup
    app.kubernetes.io/component: setup
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  DEBUG: "false"
  KML_LOCAL_PATH: "/app/railroad/arc/thailand_railways_combined.kml"
  ROUTE_EXTENSIONS_KML_PATH: "/app/railroad/route_extensions.kml"
  STATIONS_KML_PATH: "/app/railroad/20260428Thai_railway_stations.kml"
  STATION_ALIASES_PATH: "/app/railroad/arc/thai_railway_stations_full.json"
  SCHEDULE_RAW_DIR: "/app/schedule/raw"
  MIN_ROUTES_EXPECTED: "1"
  MIN_STATIONS_EXPECTED: "10"
  MIN_TRAINS_EXPECTED: "1"
  TOPOLOGY_SNAP_DISTANCE_M: "500"
  TOPOLOGY_ROUTE_MATCH_DISTANCE_M: "25"
  SETUP_PORT: "8003"
