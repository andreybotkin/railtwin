apiVersion: apps/v1
kind: Deployment
metadata:
  name: raildbsetup
  namespace: railway
  labels:
    app.kubernetes.io/name: raildbsetup
    app.kubernetes.io/component: setup
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: raildbsetup
      app.kubernetes.io/component: setup
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raildbsetup
        app.kubernetes.io/component: setup
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for postgres..."
                sleep 3
              done
              echo "Postgres is ready"
      containers:
        - name: raildbsetup
          image: ghcr.io/andreybotkin/railtwin/raildbsetup:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8003
              protocol: TCP
          envFrom:
            - configMapRef:
                name: raildbsetup-config
            - secretRef:
                name: raildbsetup-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always
