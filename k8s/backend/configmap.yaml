apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: railway
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
data:
  APP_NAME: "Thailand Railway Digital Twin"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  ENVIRONMENT: "production"
  API_V1_PREFIX: "/api/v1"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "http://localhost:3000,https://rthfi.com,https://www.rthfi.com"
  RATE_LIMIT_PER_MINUTE: "100"
  WS_HEARTBEAT_INTERVAL: "5"
