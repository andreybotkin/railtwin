apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: railway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: edge
data:
  APP_NAME: "Thailand Railway Digital Twin Gateway"
  APP_VERSION: "1.0.0"
  SIMULATION_URL: "http://simulation-service:8000"
  REDIS_URL: "redis://redis-service:6379/0"
  CORS_ORIGINS: "https://rthfi.com,https://www.rthfi.com"
  WS_POLL_INTERVAL: "2"
